name: semantic-lint

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      MERMAN_CLI_VERSION: '0.7.0'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"
      # uv provides uvx, which `bun semantic` uses to run semgrep.
      # Pinned to astral-sh/setup-uv v7.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: '3.14'
      - name: Set up Rust for Merman
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Cache Merman CLI
        id: cache-merman-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/bin/merman-cli
          key: >-
            merman-cli-${{ runner.os }}-${{ runner.arch }}-${{
            env.MERMAN_CLI_VERSION }}
      - name: Install Merman CLI
        if: steps.cache-merman-cli.outputs.cache-hit != 'true'
        run: >-
          cargo +1.95.0 install merman-cli
          --version "=${MERMAN_CLI_VERSION}" --locked
      - run: bun install --frozen-lockfile
      - name: Install mdtablefix
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@3822201c597078a5ed1939bdf067fe06a3d78a9d
        with:
          version: "0.6.0"
      - run: make check-fmt
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'
      - name: Enforce en-GB-oxendict spelling
        run: make spelling
      - name: Validate Mermaid diagrams
        run: make nixie NIXIE_ARGS=--no-sandbox
      - run: bun semantic

  # Builds the site and runs the test suite on every pull request, so a
  # change that breaks either (including a Dependabot bump that automerge
  # would otherwise land) turns the required `build-test` check red.
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The build and tests run dependency code that needs no Git token.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: "latest"
      - run: bun install --frozen-lockfile
      # `tokens:build` runs the Style Dictionary build under node, as the
      # Pages build does.
      - run: bun run tokens:build
      - run: bun run build
      - run: bun run test
